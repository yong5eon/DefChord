<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} Swagger UI</title>
  <meta name="description" content="{{description}}">
  <style>
    :root {
      --ui-font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      --code-font: Consolas, "SFMono-Regular", Menlo, "Malgun Gothic", "Apple SD Gothic Neo", monospace;
    }
    body { margin: 0; background: #fafafa; font-family: var(--ui-font); }
    .swagger-ui, .swagger-ui * { font-family: var(--ui-font) !important; }
    .swagger-ui code, .swagger-ui code *, .swagger-ui pre, .swagger-ui pre *,
    .swagger-ui textarea, .swagger-ui .opblock-summary-path, .swagger-ui .opblock-summary-path *,
    .swagger-ui .opblock-summary-path__deprecated, .swagger-ui .opblock-summary-path__deprecated * {
      font-family: var(--code-font) !important;
    }
    #loading, #error, noscript { display: block; margin: 16px 20px; font-size: 14px; line-height: 1.6; }
    #error { color: #b00020; white-space: pre-wrap; }
    #error a { margin-left: 8px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <p id="loading" role="status">Swagger UI를 불러오는 중입니다.</p>
  <div id="error" role="alert" hidden><span id="error-message"></span><a href="{{spec_url}}">OpenAPI 문서</a></div>
  <noscript>Swagger UI를 사용하려면 JavaScript를 활성화하세요. <a href="{{spec_url}}">OpenAPI 문서</a></noscript>
  <div id="swagger-ui" data-spec-url="{{spec_url}}"></div>
  <script>
    'use strict';
    const error = document.getElementById('error');
    function fail(message) {
      document.getElementById('loading').hidden = true;
      error.hidden = false;
      document.getElementById('error-message').textContent = message;
    }
    const stylesheet = document.createElement('link');
    stylesheet.rel = 'stylesheet';
    stylesheet.crossOrigin = 'anonymous';
    stylesheet.href = 'https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.0/swagger-ui.css';
    stylesheet.addEventListener('error', () => fail('Swagger UI 스타일을 불러오지 못했습니다. CDN 연결을 확인하세요.'));
    document.head.append(stylesheet);
  </script>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.32.0/swagger-ui-bundle.js" crossorigin="anonymous"></script>
  <script>
    if (typeof SwaggerUIBundle !== 'function') {
      fail('Swagger UI를 불러오지 못했습니다. CDN 연결을 확인하세요.');
    } else {
      try {
        window.ui = SwaggerUIBundle({
          url: document.getElementById('swagger-ui').dataset.specUrl,
          dom_id: '#swagger-ui',
          deepLinking: true,
          validatorUrl: null,
          persistAuthorization: false,
          queryConfigEnabled: false,
          withCredentials: false,
          requestInterceptor(request) {
            const url = new URL(request.url, location.origin);
            if (url.origin !== location.origin || url.username || url.password) {
              throw new Error('같은 출처의 API와 문서만 요청할 수 있습니다.');
            }
            request.credentials = 'same-origin';
            request.redirect = 'error';
            return request;
          },
          onComplete() { document.getElementById('loading').hidden = true; }
        });
      } catch (failure) {
        fail('Swagger UI 초기화 실패: ' + failure.message);
      }
    }
  </script>
</body>
</html>
